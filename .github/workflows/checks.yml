# The two gates AGENTS.md § "Before reporting a change complete" names, run on every push to
# main and every pull request, on both platforms the plugin ships to. From the repo root on
# purpose: `skills/daily/pytest.ini` scopes a run started in that folder to the skill's own
# suite, which skips every repo-level guard and still reports green.
#
# Both operating systems, not one: `tests/test_install_scripts.py` drives the PowerShell
# installers, the screenshot pipeline is Windows-only, and the session hook is a `sh` script
# whose known Windows gap is a machine without Git Bash. Whatever a platform cannot run
# surfaces here as a skip, which is the point of running it there.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest + pyright (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The floor README.md states and pyrightconfig.json enforces, and a current release.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # From `requirements-dev.txt` and not a list repeated here: the maintainer running the
      # gates by hand reads that same file out of AGENTS.md § "Before reporting a change
      # complete", and two lists drifting is a defect that reports green on one machine and
      # fails on the next. Each entry says there why the gates need it.
      - name: Install the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests skills/daily/tests

      - name: Type check
        run: pyright

  # The same activity-source tests, served by the genuine ActivityWatch server rather than
  # the suite's fake (`skills/daily/tests/real_aw.py`). The fake is a model of the server;
  # this is what checks the model. Pinned to a release so a red run means the plugin or the
  # fake moved, not ActivityWatch — bump the version deliberately and read what changes.
  real-activitywatch:
    name: pytest --real-aw (ActivityWatch ${{ matrix.aw }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        aw: ["v0.14.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fetch the ActivityWatch server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ matrix.aw }}" -R ActivityWatch/activitywatch \
            -p "activitywatch-${{ matrix.aw }}-linux-x86_64.zip" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/activitywatch-*.zip -d "$RUNNER_TEMP/aw"
          echo "BILLABLES_AW_SERVER=$RUNNER_TEMP/aw/activitywatch/aw-server-rust/aw-server-rust" >> "$GITHUB_ENV"

      - name: Tests against the real server
        run: python -m pytest -q skills/daily/tests --real-aw

  # The shared Windows end-to-end job for the check-in watchers (check-in-answers T14). It
  # registers the logon task for real, serves answers from the real Windows aw-server and
  # runs the daily scripts over them. Later builds add steps to the driver, not to this job.
  # Not shown here, and said so in the driver: a real away period, the logon trigger after a
  # real sign-in, a person answering the dialog, focus. The runner is an admin account.
  windows-e2e:
    name: check-in watchers end to end (windows-latest, ActivityWatch ${{ matrix.aw }})
    runs-on: windows-latest
    strategy:
      matrix:
        aw: ["v0.14.1"]
    steps:
      - uses: actions/checkout@v4

      # 3.11 or newer: the pinned `aw-watcher-ask-away` requires it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the ActivityWatch server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ matrix.aw }}" -R ActivityWatch/activitywatch `
            -p "activitywatch-${{ matrix.aw }}-windows-x86_64.zip" -D "$env:RUNNER_TEMP"
          Expand-Archive "$env:RUNNER_TEMP\activitywatch-*.zip" -DestinationPath "$env:RUNNER_TEMP\aw"
          "AW_SERVER=$env:RUNNER_TEMP\aw\activitywatch\aw-server-rust\aw-server-rust.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check-in watchers end to end
        run: python tests/e2e/windows_checkin_e2e.py "$env:AW_SERVER"
